; PHP-FPM Pool Configuration (Tuned for Mobile / Lean Linux Server 4GB–8GB RAM)
; Save to /etc/php/8.x/fpm/pool.d/www.conf or $PREFIX/etc/php-fpm.d/www.conf

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Dynamic process management to save RAM
pm = dynamic

; ── Mobile / Termux Profile (Safe for 4GB–8GB Shared RAM) ─────────────
; Each Laravel worker consumes ~35MB RAM
; 16 workers max = ~560MB RAM footprint (Safe against OOM killer)
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.process_idle_timeout = 10s

; Respawn workers regularly to prevent memory leaks in long-running processes
pm.max_requests = 500

; ── High-Memory Cloud Server Profile (Uncomment ONLY for 16GB+ Dedicated RAM) ──
; pm.max_children = 100
; pm.start_servers = 20
; pm.min_spare_servers = 10
; pm.max_spare_servers = 30

; Timeout handling
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm-slow.log
