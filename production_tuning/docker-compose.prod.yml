version: '3.8'

services:
  # PgBouncer Connection Pooler for PostgreSQL
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://${DB_USERNAME:-root}:${DB_PASSWORD:-root}@${DB_HOST:-postgres}:5432/${DB_DATABASE:-uni_activity}
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=100
      - POOL_MODE=transaction
    ports:
      - "6432:6432"
    restart: always
    networks:
      - prod-network

  # Redis for Cache, Session, Queue, and Reverb Pub/Sub
  redis:
    image: redis:alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    restart: always
    networks:
      - prod-network

  # Laravel Octane (Swoole High-Performance Engine)
  octane:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=8 --task-workers=4
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=pgsql
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_DATABASE=${DB_DATABASE:-uni_activity}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
    depends_on:
      - pgbouncer
      - redis
    restart: always
    networks:
      - prod-network

  # Queue Worker for Background Processing & Notifications
  queue-worker:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    command: php artisan queue:work --queue=high,default --tries=3 --timeout=90 --sleep=2
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_DATABASE=${DB_DATABASE:-uni_activity}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - pgbouncer
    restart: always
    networks:
      - prod-network

  # Laravel Reverb (WebSocket Server)
  reverb:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge
