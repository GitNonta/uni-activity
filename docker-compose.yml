version: '3.8'

services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app-1
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
      - storage-framework:/var/www/html/storage/framework
      - ./docker/supervisord.conf:/etc/supervisord.conf
    networks:
      - laravel-network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - NODE_ID=node-1
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-uni_activity}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - CHOKIDAR_USEPOLLING=true
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=uni-chat
      - REVERB_APP_KEY=uni-chat-key
      - REVERB_APP_SECRET=uni-chat-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app-2
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
      - storage-framework:/var/www/html/storage/framework
      - ./docker/supervisord.conf:/etc/supervisord.conf
    networks:
      - laravel-network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - NODE_ID=node-2
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-uni_activity}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - CHOKIDAR_USEPOLLING=true
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=uni-chat
      - REVERB_APP_KEY=uni-chat-key
      - REVERB_APP_SECRET=uni-chat-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  load-balancer:
    image: nginx:alpine
    container_name: laravel-lb
    restart: unless-stopped
    volumes:
      - ./docker/lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
      - "8080:8080"
    networks:
      - laravel-network
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: laravel-dragonfly
    restart: unless-stopped
    command: dragonfly --cache_mode=true --maxmemory=512mb
    volumes:
      - dragonfly-data:/data
    networks:
      laravel-network:
        aliases:
          - redis
          - dragonfly
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: laravel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-uni_activity}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - laravel-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-uni_activity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ngrok for HTTPS tunneling (Optional)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: laravel-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "load-balancer:80"
      - "--log=stdout"
      - "--log-level=info"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    networks:
      - laravel-network
    ports:
      - "4040:4040"
    depends_on:
      - load-balancer

networks:
  laravel-network:
    driver: bridge

volumes:
  dragonfly-data:
    driver: local
  storage-framework:
    driver: local
  postgres-data:
    driver: local
