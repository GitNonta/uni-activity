worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    
    # Map Upgrade header to Connection header for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream pool with least_conn and active-active replicas
    upstream app {
        least_conn;
        server app1:80 max_fails=3 fail_timeout=10s;
        server app2:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream pool for Reverb WebSocket
    upstream reverb {
        least_conn;
        server app1:8080 max_fails=3 fail_timeout=10s;
        server app2:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Extract port from Host header or default to server port
    map $http_host $forwarded_port {
        ~:(\d+)$ $1;
        default $server_port;
    }

    # Real IP from Ngrok/Proxy
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Main Web Server (Port 80 -> mapped to 8000 on host)
    server {
        listen 80;
        server_name _;

        # Static assets direct caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://app;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            # Allow upstream keepalive/persistent connections
            proxy_set_header Connection "";
            proxy_pass http://app;
            
            # Resilience settings
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Reverb (WebSocket) Proxy for same-port access (Ngrok friendly)
        location /app {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            
            proxy_pass http://reverb;
            proxy_read_timeout 86400s;
        }

        # Health check endpoint for Load Balancer
        location /health-lb {
            access_log off;
            return 200 "load-balancer-is-healthy\n";
        }
    }

    # Dedicated WebSocket Server (Port 8080)
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass http://reverb;
            proxy_read_timeout 86400s;
        }
    }
}
