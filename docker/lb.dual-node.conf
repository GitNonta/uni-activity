# Nginx Load Balancer Config for Dual-Node Mobile Cluster (Termux Phone 1 + Phone 2)
# File: docker/lb.dual-node.conf

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # ── รองรับรูป selfie / profile photo upload (fails ที่ 1MB default ได้) ──
    client_max_body_size 20m;

    # ── Gzip ตอบสนองไวขึ้นบนมือถือ ──
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Map Upgrade header for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Cluster: Laravel Octane Instances
    upstream laravel_cluster {
        least_conn;
        # Node 1 (Local Primary Phone) - 3 parallel workers
        server 127.0.0.1:8000 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8003 max_fails=2 fail_timeout=5s;
        # Node 2 (Secondary Worker Phone) - 3 parallel workers
        server 192.168.1.140:8000 max_fails=2 fail_timeout=5s;
        server 192.168.1.140:8002 max_fails=2 fail_timeout=5s;
        server 192.168.1.140:8003 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    # Upstream AI Microservice (FastAPI + InsightFace)
    upstream ai_cluster {
        # Primary AI on Node 2 (Phone 2 = 192.168.1.140)
        server 192.168.1.140:8001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8001 backup;
        keepalive 16;
    }

    # Upstream Reverb WebSocket (REVERB_INTERNAL_PORT=8082 ใน .env จริง)
    upstream reverb_cluster {
        server 127.0.0.1:8082 max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    # Main Gateway Server (Port 8088 / 80)
    server {
        # 8080 = Cloudflare tunnel origin (legacy, kept for the quick tunnel), 8088 = LAN LB
        listen 8080;
        listen 8088;
        server_name _;

        # Static assets cache
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2)$ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://laravel_cluster;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Main App Traffic -> Load balanced to Node 1 & Node 2
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_pass http://laravel_cluster;

            # Failover if a phone goes to sleep or drops WiFi
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket Proxy (/app และ /apps สำหรับ Laravel Reverb)
        location ~ ^/(app|apps)(/|$) {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_pass http://reverb_cluster;
            proxy_read_timeout 86400s;
        }

        # Direct AI Verification Route
        location /ai/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://ai_cluster/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Node Health Check
        location /health-cluster {
            access_log off;
            return 200 "{\"status\":\"ok\",\"cluster\":\"dual-node-active\"}\n";
        }
    }
}
