# Nginx Edge Proxy & Static Asset Cache optimized for Laravel Octane (FrankenPHP)
# docker/nginx.conf

worker_processes auto;
pid /run/nginx.pid;
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    server_tokens off;

    # Buffers & Upload Size
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    client_max_body_size 100M;
    large_client_header_buffers 4 16k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # Rate limiting
    limit_req_zone $realip_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $realip_remote_addr zone=login:10m rate=100r/s;

    # Map Upgrade header for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream to Laravel Octane (In-Memory Worker Pool)
    upstream octane_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Upstream to Laravel Reverb (WebSocket)
    upstream reverb_backend {
        server 127.0.0.1:8082;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Static assets - direct from disk with aggressive caching (Zero-Copy)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # Laravel Reverb WebSocket Proxy
        location /app/ {
            proxy_pass http://reverb_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Dynamic Requests -> Proxy to Laravel Octane In-Memory Engine
        location / {
            proxy_pass http://octane_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
        }
        
        location ~ \.(env|log|conf|md|json|lock)$ {
            deny all;
        }
        
        # ❌ FIXED V10: Block /storage directory to prevent directory listing/unauthorized access
        location /storage {
            deny all;
        }
    }
}
