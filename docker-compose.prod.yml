# =================================================================
# PRODUCTION DOCKER COMPOSE - UNI-ACTIVITY (Zero Trust Network Architecture)
# Databases & Cache are strictly bound to internal segmented network (internal: true)
# Only Nginx Ingress is exposed to public HTTP/HTTPS ports (80/443)
# =================================================================
version: '3.8'

services:
  # ─── Public Ingress / Reverse Proxy (SSL + HTTP) ─────────────────
  load-balancer:
    image: nginx:alpine
    container_name: uni-activity-lb-prod
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Laravel Reverb WebSocket
    networks:
      - frontend-network
    depends_on:
      app:
        condition: service_healthy

  # ─── Application Web Workers (PHP 8.3 Octane / Swoole) ───────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: uni-activity-app-prod
    restart: unless-stopped
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-uni_activity}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_CONNECTION=reverb
    networks:
      - frontend-network
      - backend-network
    expose:
      - "8000"
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Priority Background Queue Workers ───────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: uni-activity-queue-prod
    restart: unless-stopped
    command: php artisan queue:work redis --queue=ai,notifications,exports,cassandra,default --tries=3 --timeout=120 --sleep=1
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-uni_activity}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Internal Redis / Dragonfly Cache Cluster (Zero Public Access)
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: uni-activity-redis-prod
    restart: unless-stopped
    command: dragonfly --cache_mode=true --maxmemory=1gb --requirepass=${REDIS_PASSWORD:-}
    volumes:
      - dragonfly-data:/data
    networks:
      - backend-network
    expose:
      - "6379"

  # ─── Internal PostgreSQL Primary Database (Zero Public Access) ───
  postgres:
    image: postgres:16-alpine
    container_name: uni-activity-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-uni_activity}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-uni_activity}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Ingress network connecting Nginx to Application
  frontend-network:
    driver: bridge

  # Fully isolated backend network (Zero external routing / Internet access)
  backend-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
    driver: local
  dragonfly-data:
    driver: local
  storage-app:
    driver: local
  storage-logs:
    driver: local
