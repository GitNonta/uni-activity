name: Deploy to Termux Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'
      - '.agents/**'

concurrency:
  group: uni-activity-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, termux]

    steps:
      - name: Deploy latest main revision
        run: |
          set -eu
          cd /data/data/com.termux/files/home/uni-activity
          git fetch origin main
          git reset --hard origin/main

          # ── Rebuild Go binaries (cf-manager + monitor) ────────────────────
          # Without this step, tunnel-management fixes (Error 1033 detection,
          # verified restarts) never reach the running binaries on the device.
          GO_BIN=""
          if [ -x /data/data/com.termux/files/usr/bin/go ]; then
            GO_BIN=/data/data/com.termux/files/usr/bin/go
          elif command -v go >/dev/null 2>&1; then
            GO_BIN="$(command -v go)"
          fi
          if [ -n "$GO_BIN" ]; then
            cd go-monitor

            OLD_CF_SHA=""
            if [ -f cf-manager-bin ]; then
              OLD_CF_SHA="$(sha256sum cf-manager-bin | cut -d' ' -f1)"
            fi
            OLD_MON_SHA=""
            if [ -f go-monitor ]; then
              OLD_MON_SHA="$(sha256sum go-monitor | cut -d' ' -f1)"
            fi

            # -buildvcs=false -trimpath → reproducible checksums, so identical
            # source produces an identical binary. WITHOUT this, Go embeds the
            # git revision into every build, the checksum changes on every
            # commit (including [auto-sync] URL pushes), and the restart below
            # would kill cf-manager/cloudflared on every deploy — a permanent
            # tunnel-churn loop (each restart = new quick-tunnel URL = new
            # commit = new deploy = another kill).
            "$GO_BIN" build -buildvcs=false -trimpath -o cf-manager-bin ./cf-manager
            "$GO_BIN" build -buildvcs=false -trimpath -o go-monitor .

            NEW_CF_SHA="$(sha256sum cf-manager-bin | cut -d' ' -f1)"
            NEW_MON_SHA="$(sha256sum go-monitor | cut -d' ' -f1)"

            # Ensure rogue /root/cf-manager is killed and cleaned up
            pkill -9 -f "/root/cf-manager" 2>/dev/null || true
            rm -f "$HOME/cf-manager" 2>/dev/null || true

            # Restart cf-manager-bin in tmux auto_updater
            if [ "$OLD_CF_SHA" != "$NEW_CF_SHA" ] || ! pgrep -f "cf-manager-bin" >/dev/null 2>&1; then
              pkill -9 -f "cf-manager-bin" 2>/dev/null || true
              tmux has-session -t auto_updater 2>/dev/null || tmux new-session -d -s auto_updater 'bash /data/data/com.termux/files/home/svc_auto_updater.sh'
              echo "cf-manager updated & notified supervisor"
            fi

            # Manage go-monitor
            if [ "$OLD_MON_SHA" != "$NEW_MON_SHA" ] || ! pgrep -f "go-monitor -port" >/dev/null 2>&1; then
              pkill -9 -f "go-monitor -port" 2>/dev/null || true
              sleep 1
              setsid nohup ./go-monitor -port 9999 >>../storage/logs/go-monitor.log 2>&1 &
              echo "go-monitor restarted"
            fi

            cd ..
          else
            echo "WARNING: Go toolchain not found — skipping Go binary rebuild" >&2
          fi

          if [ -x /data/data/com.termux/files/usr/bin/composer ]; then
            /data/data/com.termux/files/usr/bin/composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-reqs
          elif command -v composer >/dev/null 2>&1; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-reqs
          fi
          if [ -x /data/data/com.termux/files/usr/bin/npm ]; then
            /data/data/com.termux/files/usr/bin/npm run build
          elif command -v npm >/dev/null 2>&1; then
            npm run build
          fi
          /data/data/com.termux/files/usr/bin/php artisan optimize:clear
          /data/data/com.termux/files/usr/bin/php artisan view:cache
          /data/data/com.termux/files/usr/bin/php artisan octane:reload 2>/dev/null || true
          pkill -USR2 -f "php-fpm: master" 2>/dev/null || true
          /data/data/com.termux/files/usr/bin/php artisan reverb:restart 2>/dev/null || true
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Deployed $(git rev-parse --short HEAD)"
