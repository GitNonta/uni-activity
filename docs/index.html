<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Activity System | Redirecting...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', 'Kanit', -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            overflow: hidden;
            padding: 1.5rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid var(--primary-light);
            animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.85); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.2; }
            100% { transform: scale(0.85); opacity: 0.8; }
        }
        .icon-box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #38bdf8);
            border-radius: 999px;
            width: 40%;
            animation: progressMove 1.2s ease-in-out infinite alternate;
        }
        @keyframes progressMove {
            0% { width: 15%; transform: translateX(0); }
            100% { width: 70%; transform: translateX(50%); }
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 0.4rem 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            font-size: 0.78rem;
            color: #cbd5e1;
        }
        .dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }
    </style>
    <script>
        // Fast Redirect Script in HEAD for zero-delay execution
        (function() {
            function getTargetUrl(baseUrl, searchStr) {
                const params = new URLSearchParams(searchStr);
                const path = params.get('path') || '';
                const cleanPath = path.startsWith('/') ? path.slice(1) : path;
                
                params.delete('path');
                const extraQuery = params.toString();
                
                let target = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
                target += cleanPath;
                if (extraQuery) {
                    target += (target.includes('?') ? '&' : '?') + extraQuery;
                }
                return target;
            }

            const cachedUrl = sessionStorage.getItem('active_tunnel_url');
            if (cachedUrl) {
                window.location.replace(getTargetUrl(cachedUrl, window.location.search));
            }
        })();
    </script>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <div class="pulse-ring"></div>
            <div class="icon-box">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
        </div>
        
        <h1 id="title">University Activity System</h1>
        <p id="subtitle">กำลังเชื่อมต่อระบบกิจกรรมนักศึกษา...</p>

        <div class="progress-bar" id="progress">
            <div class="progress-inner"></div>
        </div>

        <div class="status-badge">
            <span class="dot"></span>
            <span>เชื่อมต่อกับเซิร์ฟเวอร์ความเร็วสูง</span>
        </div>
    </div>

    <script>
        (function() {
            const searchStr = window.location.search;

            function redirectNow(baseUrl) {
                sessionStorage.setItem('active_tunnel_url', baseUrl);
                
                const params = new URLSearchParams(searchStr);
                const path = params.get('path') || '';
                const cleanPath = path.startsWith('/') ? path.slice(1) : path;
                params.delete('path');
                const extraQuery = params.toString();

                let target = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
                target += cleanPath;
                if (extraQuery) {
                    target += (target.includes('?') ? '&' : '?') + extraQuery;
                }

                try {
                    const link = document.createElement('link');
                    link.rel = 'preconnect';
                    link.href = new URL(baseUrl).origin;
                    document.head.appendChild(link);
                } catch(e) {}

                window.location.replace(target);
            }

            fetch('active_url.json?t=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    if (!data.url) throw new Error('Invalid URL');
                    redirectNow(data.url);
                })
                .catch(err => {
                    console.error('Redirect error:', err);
                    document.getElementById('title').innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
                    document.getElementById('subtitle').innerText = 'โปรดตรวจสอบการเชื่อมต่อ หรือติดต่อผู้ดูแลระบบเพื่อเปิดบริการเซิร์ฟเวอร์';
                    document.getElementById('progress').style.display = 'none';
                });
        })();
    </script>
</body>
</html>
