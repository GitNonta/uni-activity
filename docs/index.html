<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-bg: #eef2ff;
            --bg-color: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .splash-container {
            width: 100%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .app-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 2rem;
            filter: drop-shadow(0 6px 12px rgba(79, 70, 229, 0.12));
            animation: float-logo 3s ease-in-out infinite;
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .progress-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .progress-container {
            width: 100%;
            background-color: var(--primary-bg);
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f46e5, #6366f1, #818cf8);
            border-radius: 999px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-percent {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
        }

        .btn-retry {
            margin-top: 2rem;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: none;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-retry:hover {
            background: var(--primary-light);
        }

        .btn-retry:active {
            transform: scale(0.98);
        }
    </style>
    <script>
        (function() {
            let currentPercent = 0;
            let animFrame = null;

            function setProgress(targetPercent, duration = 300) {
                targetPercent = Math.min(100, Math.max(0, targetPercent));
                const progressBar = document.getElementById('progress-bar');
                const progressPercent = document.getElementById('progress-percent');
                
                if (progressBar) progressBar.style.width = targetPercent + '%';
                
                if (animFrame) cancelAnimationFrame(animFrame);
                const startPercent = currentPercent;
                const startTime = performance.now();
                
                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const interpolated = Math.round(startPercent + (targetPercent - startPercent) * progress);
                    currentPercent = interpolated;
                    if (progressPercent) progressPercent.innerText = interpolated + '%';
                    if (progress < 1) {
                        animFrame = requestAnimationFrame(animate);
                    }
                }
                animFrame = requestAnimationFrame(animate);
            }

            function getTargetUrl(baseUrl, searchStr) {
                const params = new URLSearchParams(searchStr);
                params.delete('url');
                params.delete('reset');

                const path = params.get('path') || '';
                const cleanPath = path.startsWith('/') ? path.slice(1) : path;
                params.delete('path');

                const extraQuery = params.toString();
                let target = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
                target += cleanPath;
                if (extraQuery) {
                    target += (target.includes('?') ? '&' : '?') + extraQuery;
                }
                return target;
            }

            const searchParams = new URLSearchParams(window.location.search);
            const overrideUrl = searchParams.get('url');
            const forceReset = searchParams.get('reset');

            if (forceReset) {
                sessionStorage.removeItem('active_tunnel_url');
            }

            async function isUrlAlive(baseUrl) {
                if (!baseUrl || typeof baseUrl !== 'string' || !baseUrl.startsWith('http')) {
                    return false;
                }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);

                try {
                    const res = await fetch(baseUrl.replace(/\/$/, '') + '/up', {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    return res.ok || res.status < 500;
                } catch (e) {
                    clearTimeout(timeoutId);
                    const controller2 = new AbortController();
                    const timeoutId2 = setTimeout(() => controller2.abort(), 2500);
                    try {
                        await fetch(baseUrl, {
                            method: 'HEAD',
                            mode: 'no-cors',
                            cache: 'no-store',
                            signal: controller2.signal
                        });
                        clearTimeout(timeoutId2);
                        return true;
                    } catch (e2) {
                        clearTimeout(timeoutId2);
                        return false;
                    }
                }
            }

            let attemptCount = 0;

            async function resolveAndRedirect() {
                attemptCount++;
                const searchStr = window.location.search;

                setProgress(15, 200);

                // 1. Check override URL
                if (overrideUrl) {
                    setProgress(35, 200);
                    if (await isUrlAlive(overrideUrl)) {
                        setProgress(100, 200);
                        sessionStorage.setItem('active_tunnel_url', overrideUrl);
                        setTimeout(() => window.location.replace(getTargetUrl(overrideUrl, searchStr)), 200);
                        return;
                    }
                }

                // 2. Check cached URL
                const cachedUrl = sessionStorage.getItem('active_tunnel_url');
                if (cachedUrl) {
                    setProgress(55, 250);
                    if (await isUrlAlive(cachedUrl)) {
                        setProgress(100, 200);
                        setTimeout(() => window.location.replace(getTargetUrl(cachedUrl, searchStr)), 200);
                        return;
                    } else {
                        sessionStorage.removeItem('active_tunnel_url');
                    }
                }

                // 3. Fetch active_url.json
                setProgress(75, 300);
                try {
                    const res = await fetch('active_url.json?t=' + Date.now());
                    const data = await res.json();

                    if (data && data.url) {
                        setProgress(88, 250);
                        if (await isUrlAlive(data.url)) {
                            setProgress(100, 150);
                            sessionStorage.setItem('active_tunnel_url', data.url);
                            setTimeout(() => window.location.replace(getTargetUrl(data.url, searchStr)), 200);
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('active_url.json fetch failed:', err);
                }

                // 4. Server restarting/updating - Reset progress to 20% and loop in 3s
                setProgress(20, 300);

                const retryBtn = document.getElementById('retry-btn');
                if (retryBtn && attemptCount >= 4) {
                    retryBtn.style.display = 'inline-block';
                }

                setTimeout(resolveAndRedirect, 3000);
            }

            document.addEventListener('DOMContentLoaded', resolveAndRedirect);
        })();
    </script>
</head>
<body>
    <div class="splash-container">
        <!-- Web Logo Image -->
        <img src="logo.svg" alt="UNI Activity Logo" class="app-logo">

        <!-- Progress Loading Bar & 1-100% Indicator -->
        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-percent" id="progress-percent">0%</div>
        </div>

        <button id="retry-btn" class="btn-retry" onclick="location.reload()">รีโหลดอีกครั้ง</button>
    </div>
</body>
</html>
