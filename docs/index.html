<!DOCTYPE html>
<!-- Cache-Bust: 202608050242 -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-bg: #eef2ff;
            --bg-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #0f172a;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .splash-container {
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .app-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 2.25rem;
            filter: drop-shadow(0 6px 12px rgba(79, 70, 229, 0.12));
            animation: float-logo 3s ease-in-out infinite;
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .progress-container {
            width: 100%;
            background-color: var(--primary-bg);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0040ff, #43e8f4, #49f9dc);
            border-radius: 999px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
    <script>
        (function() {
            function setProgress(targetPercent) {
                targetPercent = Math.min(100, Math.max(0, targetPercent));
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) {
                    progressBar.style.width = targetPercent + '%';
                }
            }

            function getTargetUrl(baseUrl, searchStr) {
                const params = new URLSearchParams(searchStr);
                params.delete('url');
                params.delete('reset');

                const path = params.get('path') || '';
                const cleanPath = path.startsWith('/') ? path.slice(1) : path;
                params.delete('path');

                const extraQuery = params.toString();
                let target = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
                target += cleanPath;
                if (extraQuery) {
                    target += (target.includes('?') ? '&' : '?') + extraQuery;
                }
                return target;
            }

            const searchParams = new URLSearchParams(window.location.search);
            const overrideUrl = searchParams.get('url');
            const forceReset = searchParams.get('reset');

            if (forceReset) {
                sessionStorage.removeItem('active_tunnel_url');
            }

            async function isUrlAlive(baseUrl) {
                if (!baseUrl || typeof baseUrl !== 'string' || !baseUrl.startsWith('http')) {
                    return false;
                }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);

                try {
                    const res = await fetch(baseUrl.replace(/\/$/, '') + '/up', {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    return res.ok || res.status < 500;
                } catch (e) {
                    clearTimeout(timeoutId);
                    const controller2 = new AbortController();
                    const timeoutId2 = setTimeout(() => controller2.abort(), 2500);
                    try {
                        await fetch(baseUrl, {
                            method: 'HEAD',
                            mode: 'no-cors',
                            cache: 'no-store',
                            signal: controller2.signal
                        });
                        clearTimeout(timeoutId2);
                        return true;
                    } catch (e2) {
                        clearTimeout(timeoutId2);
                        return false;
                    }
                }
            }

            async function resolveAndRedirect() {
                const searchStr = window.location.search;

                // Step 1: Initializing
                setProgress(20);

                // Step 2: Check override URL
                if (overrideUrl) {
                    setProgress(40);
                    if (await isUrlAlive(overrideUrl)) {
                        setProgress(100);
                        sessionStorage.setItem('active_tunnel_url', overrideUrl);
                        setTimeout(() => window.location.replace(getTargetUrl(overrideUrl, searchStr)), 200);
                        return;
                    }
                }

                // Step 3: Check cached URL
                const cachedUrl = sessionStorage.getItem('active_tunnel_url');
                if (cachedUrl) {
                    setProgress(60);
                    if (await isUrlAlive(cachedUrl)) {
                        setProgress(100);
                        setTimeout(() => window.location.replace(getTargetUrl(cachedUrl, searchStr)), 200);
                        return;
                    } else {
                        sessionStorage.removeItem('active_tunnel_url');
                    }
                }

                // Step 4: Fetch active_url.json
                setProgress(80);
                try {
                    const res = await fetch('active_url.json?t=' + Date.now());
                    const data = await res.json();

                    if (data && data.url) {
                        setProgress(90);
                        if (await isUrlAlive(data.url)) {
                            setProgress(100);
                            sessionStorage.setItem('active_tunnel_url', data.url);
                            setTimeout(() => window.location.replace(getTargetUrl(data.url, searchStr)), 200);
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('active_url.json fetch failed:', err);
                }

                // Step 5: Server starting/updating - Smooth loop until server is active
                setProgress(25);
                setTimeout(resolveAndRedirect, 3000);
            }

            document.addEventListener('DOMContentLoaded', resolveAndRedirect);
        })();
    </script>
</head>
<body>
    <div class="splash-container">
        <!-- Web Logo Image -->
        <img src="logo.svg" alt="UNI Activity Logo" class="app-logo">

        <!-- Pure Loading Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>
</body>
</html>
