<!DOCTYPE html>
<!-- GitHub Pages Permanent Redirect Router for LINE Rich Menu -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังนำทางไปยัง UNI Activity...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ea580c;
            --primary-light: #f97316;
            --primary-bg: #fff7ed;
            --bg-color: #ffffff;
            --text-color: #0f172a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #202124;
                color: #f1f5f9;
            }
            .loading-text {
                color: #94a3b8 !important;
            }
            .progress-container {
                background-color: #334155 !important;
            }
            .direct-btn {
                background: #ea580c !important;
                color: #ffffff !important;
            }
            .external-btn {
                color: #cbd5e1 !important;
                border-color: #475569 !important;
            }
        }
        .splash-container {
            width: 100%;
            max-width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .app-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 1.25rem;
            filter: drop-shadow(0 6px 12px rgba(234, 88, 12, 0.15));
            animation: float-logo 2.5s ease-in-out infinite;
        }
        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .loading-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 1.25rem;
            transition: all 0.2s ease;
        }
        .progress-container {
            width: 100%;
            background-color: var(--primary-bg);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 1.5rem;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ea580c, #f97316, #fdba74);
            border-radius: 999px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .actions-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        .actions-container.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .direct-btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem 1rem;
            background: #ea580c;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
            transition: background 0.2s, transform 0.1s;
        }
        .direct-btn:active {
            transform: scale(0.98);
        }
        .external-btn {
            display: inline-block;
            width: 100%;
            padding: 0.65rem 1rem;
            background: transparent;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            transition: background 0.2s;
        }
    </style>
    <script>
        (function() {
            const FALLBACK_DEFAULT_URL = 'https://standard-headphones-nato-inflation.trycloudflare.com';
            const DEFAULT_ROUTE = '';

            function setProgress(targetPercent, text) {
                targetPercent = Math.min(100, Math.max(0, targetPercent));
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) progressBar.style.width = targetPercent + '%';
                const statusText = document.getElementById('status-text');
                if (statusText && text) statusText.textContent = text;
            }

            function getTargetUrl(baseUrl, searchStr, defaultTarget) {
                baseUrl = (baseUrl || FALLBACK_DEFAULT_URL).trim().replace(/\/+$/, '');
                const params = new URLSearchParams(searchStr || '');
                params.delete('url');
                params.delete('reset');

                let dest = params.get('to') || params.get('path') || defaultTarget || '';
                params.delete('to');
                params.delete('path');

                const routeMap = {
                    'login': 'login',
                    'auth': 'login',
                    'signin': 'login',
                    'jobs': 'jobs',
                    'job': 'jobs',
                    'map': 'map',
                    'explorer': 'map',
                    'activities': 'activities',
                    'activity': 'activities',
                    'announcements': 'announcements',
                    'announcement': 'announcements',
                    'news': 'announcements',
                    'my-activities': 'my-activities',
                    'history': 'history',
                    'profile': 'profile',
                    'home': ''
                };

                if (routeMap[dest] !== undefined) {
                    dest = routeMap[dest];
                }

                const cleanPath = dest.startsWith('/') ? dest.slice(1) : dest;
                const extraQuery = params.toString();
                let target = baseUrl;
                if (cleanPath) {
                    target += '/' + cleanPath;
                }
                if (extraQuery) {
                    target += (target.includes('?') ? '&' : '?') + extraQuery;
                }
                return target;
            }

            async function fetchWithTimeout(url, timeoutMs) {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                    clearTimeout(id);
                    return res;
                } catch (e) {
                    clearTimeout(id);
                    throw e;
                }
            }

            function showFallbackActions(targetUrl) {
                const actions = document.getElementById('actions-container');
                const directBtn = document.getElementById('direct-btn');
                const externalBtn = document.getElementById('external-btn');

                if (directBtn) directBtn.href = targetUrl;
                if (externalBtn) {
                    const extUrl = targetUrl + (targetUrl.includes('?') ? '&' : '?') + 'openExternalBrowser=1';
                    externalBtn.href = extUrl;
                }
                if (actions) actions.classList.add('visible');
            }

            async function resolveAndRedirect() {
                const searchStr = window.location.search;
                const searchParams = new URLSearchParams(searchStr);
                const overrideUrl = searchParams.get('url');
                const forceReset = searchParams.get('reset');
                const targetRoute = window.TARGET_ROUTE || DEFAULT_ROUTE;

                if (forceReset) {
                    sessionStorage.removeItem('active_tunnel_url');
                }

                setProgress(35, 'กำลังเชื่อมต่อระบบ...');

                // 1. Explicit query override
                if (overrideUrl && overrideUrl.startsWith('http')) {
                    const target = getTargetUrl(overrideUrl, searchStr, targetRoute);
                    setProgress(100, 'กำลังเปิดหน้าเว็บ...');
                    sessionStorage.setItem('active_tunnel_url', overrideUrl);
                    showFallbackActions(target);
                    window.location.replace(target);
                    return;
                }

                let finalUrl = null;

                // 2. Try fetching active_url.json (GitHub Pages)
                setProgress(60, 'กำลังค้นหาเซิร์ฟเวอร์...');
                try {
                    const res = await fetchWithTimeout('active_url.json?t=' + Date.now(), 2500);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.url && data.url.startsWith('http')) {
                            finalUrl = data.url;
                        }
                    }
                } catch (e) {
                    console.warn('active_url.json fetch failed, trying fallback...');
                }

                // 3. Fallback: Try sessionStorage cached URL
                if (!finalUrl) {
                    const cachedUrl = sessionStorage.getItem('active_tunnel_url');
                    if (cachedUrl && cachedUrl.startsWith('http')) {
                        finalUrl = cachedUrl;
                    }
                }

                // 4. Fallback: Try raw GitHub content
                if (!finalUrl) {
                    try {
                        const rawUrl = 'https://raw.githubusercontent.com/GitNonta/uni-activity/main/docs/active_url.json?t=' + Date.now();
                        const res = await fetchWithTimeout(rawUrl, 2500);
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.url && data.url.startsWith('http')) {
                                finalUrl = data.url;
                            }
                        }
                    } catch (e2) {
                        console.warn('raw github fetch failed');
                    }
                }

                // 5. Ultimate fallback: Known default live URL
                if (!finalUrl) {
                    finalUrl = FALLBACK_DEFAULT_URL;
                }

                sessionStorage.setItem('active_tunnel_url', finalUrl);
                const targetRedirect = getTargetUrl(finalUrl, searchStr, targetRoute);

                setProgress(100, 'กำลังเปิดหน้าเว็บ...');
                showFallbackActions(targetRedirect);

                // Redirect immediately
                window.location.replace(targetRedirect);

                // Fallback timeout: if still here after 1.5s, try window.location.href
                setTimeout(function() {
                    window.location.href = targetRedirect;
                }, 1500);
            }

            // Reveal fallback action buttons if redirect takes more than 2 seconds
            setTimeout(function() {
                const searchStr = window.location.search;
                const targetRoute = window.TARGET_ROUTE || DEFAULT_ROUTE;
                const cached = sessionStorage.getItem('active_tunnel_url') || FALLBACK_DEFAULT_URL;
                showFallbackActions(getTargetUrl(cached, searchStr, targetRoute));
            }, 2000);

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', resolveAndRedirect);
            } else {
                resolveAndRedirect();
            }
        })();
    </script>
</head>
<body>
    <div class="splash-container">
        <img src="logo.svg" alt="UNI Activity Logo" class="app-logo">
        <p class="loading-text" id="status-text">กำลังเชื่อมต่อระบบ...</p>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="actions-container" id="actions-container">
            <a id="direct-btn" href="https://standard-headphones-nato-inflation.trycloudflare.com" class="direct-btn">
                แตะเพื่อเข้าสู่ระบบ UNI Activity
            </a>
            <a id="external-btn" href="#" class="external-btn">
                เปิดด้วยเบราว์เซอร์ภายนอก (Chrome / Safari)
            </a>
        </div>
    </div>
</body>
</html>
