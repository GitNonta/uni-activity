<!DOCTYPE html>
<!-- GitHub Pages Permanent Redirect Router for LINE Rich Menu -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังนำทางไปยัง UNI Activity...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ea580c;
            --primary-light: #f97316;
            --primary-bg: #fff7ed;
            --bg-color: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: #0f172a;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #202124;
                color: #f1f5f9;
            }
            .loading-text {
                color: #94a3b8 !important;
            }
            .progress-container {
                background-color: #334155 !important;
            }
        }
        .splash-container {
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .app-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 6px 12px rgba(234, 88, 12, 0.15));
            animation: float-logo 2.5s ease-in-out infinite;
        }
        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .loading-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 1.25rem;
            transition: all 0.2s ease;
        }
        .progress-container {
            width: 100%;
            background-color: var(--primary-bg);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ea580c, #f97316, #fdba74);
            border-radius: 999px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
    <script>
        (function() {
            const DEFAULT_ROUTE = ''; // default to root

            function setProgress(targetPercent, text) {
                targetPercent = Math.min(100, Math.max(0, targetPercent));
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) progressBar.style.width = targetPercent + '%';
                const statusText = document.getElementById('status-text');
                if (statusText && text) statusText.textContent = text;
            }

            function getTargetUrl(baseUrl, searchStr, defaultTarget) {
                const params = new URLSearchParams(searchStr);
                params.delete('url');
                params.delete('reset');

                let dest = params.get('to') || params.get('path') || defaultTarget || '';
                params.delete('to');
                params.delete('path');

                const routeMap = {
                    'login': 'login',
                    'auth': 'login',
                    'signin': 'login',
                    'jobs': 'jobs',
                    'job': 'jobs',
                    'map': 'map',
                    'explorer': 'map',
                    'activities': 'activities',
                    'activity': 'activities',
                    'announcements': 'announcements',
                    'announcement': 'announcements',
                    'news': 'announcements',
                    'my-activities': 'my-activities',
                    'history': 'history',
                    'profile': 'profile',
                    'home': ''
                };

                if (routeMap[dest] !== undefined) {
                    dest = routeMap[dest];
                }

                const cleanPath = dest.startsWith('/') ? dest.slice(1) : dest;
                const extraQuery = params.toString();
                let target = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
                target += cleanPath;
                if (extraQuery) {
                    target += (target.includes('?') ? '&' : '?') + extraQuery;
                }
                return target;
            }

            const searchParams = new URLSearchParams(window.location.search);
            const overrideUrl = searchParams.get('url');
            const forceReset = searchParams.get('reset');

            if (forceReset) {
                sessionStorage.removeItem('active_tunnel_url');
            }

            async function isUrlAlive(baseUrl) {
                if (!baseUrl || typeof baseUrl !== 'string' || !baseUrl.startsWith('http')) {
                    return false;
                }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                try {
                    const res = await fetch(baseUrl.replace(/\/$/, '') + '/up', {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    return res.ok || res.status < 500;
                } catch (e) {
                    clearTimeout(timeoutId);
                    const controller2 = new AbortController();
                    const timeoutId2 = setTimeout(() => controller2.abort(), 5000);
                    try {
                        await fetch(baseUrl, {
                            method: 'HEAD',
                            mode: 'no-cors',
                            cache: 'no-store',
                            signal: controller2.signal
                        });
                        clearTimeout(timeoutId2);
                        return true;
                    } catch (e2) {
                        clearTimeout(timeoutId2);
                        // If both checks fail, still try to redirect (proxy may block /up)
                        return true;
                    }
                }
            }

            async function resolveAndRedirect() {
                const searchStr = window.location.search;
                const targetRoute = window.TARGET_ROUTE || DEFAULT_ROUTE;

                setProgress(25, 'กำลังเชื่อมต่อระบบ...');

                // 1. Override URL
                if (overrideUrl) {
                    setProgress(50, 'กำลังตรวจสอบเซิร์ฟเวอร์...');
                    if (await isUrlAlive(overrideUrl)) {
                        setProgress(100, 'กำลังเปิดหน้าเว็บ...');
                        sessionStorage.setItem('active_tunnel_url', overrideUrl);
                        setTimeout(() => window.location.replace(getTargetUrl(overrideUrl, searchStr, targetRoute)), 150);
                        return;
                    }
                }

                // 2. Cached URL
                const cachedUrl = sessionStorage.getItem('active_tunnel_url');
                if (cachedUrl) {
                    setProgress(60, 'กำลังเชื่อมต่อไปยังเซิร์ฟเวอร์...');
                    if (await isUrlAlive(cachedUrl)) {
                        setProgress(100, 'กำลังเปิดหน้าเว็บ...');
                        setTimeout(() => window.location.replace(getTargetUrl(cachedUrl, searchStr, targetRoute)), 150);
                        return;
                    } else {
                        sessionStorage.removeItem('active_tunnel_url');
                    }
                }

                // 3. Fetch active_url.json
                setProgress(80, 'กำลังค้นหาเซิร์ฟเวอร์ที่พร้อมใช้งาน...');
                try {
                    const res = await fetch('active_url.json?t=' + Date.now());
                    const data = await res.json();

                    if (data && data.url) {
                        setProgress(95, 'กำลังเปิดหน้าเว็บ...');
                        if (await isUrlAlive(data.url)) {
                            setProgress(100, 'สำเร็จ!');
                            sessionStorage.setItem('active_tunnel_url', data.url);
                            setTimeout(() => window.location.replace(getTargetUrl(data.url, searchStr, targetRoute)), 150);
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('active_url.json fetch failed:', err);
                }

                // 4. Retry with fallback redirect
                setProgress(30, 'กำลังรอเซิร์ฟเวอร์ตอบรับ...');
                retryCount = (retryCount || 0) + 1;
                if (retryCount >= 3) {
                    // After 3 retries, redirect anyway (proxy may block health checks)
                    setProgress(100, 'กำลังเปิดหน้าเว็บ...');
                    window.location.replace('https://forgotten-camera-placed-twist.trycloudflare.com/');
                    return;
                }
                setTimeout(resolveAndRedirect, 2500);
            }

            var retryCount = 0;
            document.addEventListener('DOMContentLoaded', resolveAndRedirect);
        })();
    </script>
</head>
<body>
    <div class="splash-container">
        <img src="logo.svg" alt="UNI Activity Logo" class="app-logo">
        <p class="loading-text" id="status-text">กำลังเชื่อมต่อระบบ...</p>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>
</body>
</html>
