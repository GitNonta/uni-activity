<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        html, body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .error-card {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f172a;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
            z-index: 9999;
        }
        .error-box {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
        }
    </style>
    <script>
        (function() {
            function getTargetUrl(baseUrl, searchStr) {
                let target = baseUrl.endsWith('/') ? baseUrl + 'line/callback' : baseUrl + '/line/callback';
                target += searchStr;
                return target;
            }

            const searchStr = window.location.search;

            // 1. Instant redirect if cached
            const cachedUrl = sessionStorage.getItem('active_tunnel_url');
            if (cachedUrl) {
                window.location.replace(getTargetUrl(cachedUrl, searchStr));
            }

            // 2. Fetch live URL immediately
            fetch('active_url.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    if (data && data.url) {
                        sessionStorage.setItem('active_tunnel_url', data.url);
                        window.location.replace(getTargetUrl(data.url, searchStr));
                    } else {
                        throw new Error('Invalid URL');
                    }
                })
                .catch(() => {
                    document.addEventListener('DOMContentLoaded', function() {
                        const err = document.getElementById('error-card');
                        if (err) err.style.display = 'flex';
                    });
                });
        })();
    </script>
</head>
<body>
    <div class="error-card" id="error-card">
        <div class="error-box">
            <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem; color: #ef4444;">ไม่สามารถเชื่อมต่อการผูกบัญชีได้</h2>
            <p style="font-size: 0.875rem; color: #94a3b8; margin: 0;">โปรดตรวจสอบการเชื่อมต่อ หรือติดต่อผู้ดูแลระบบ</p>
        </div>
    </div>
</body>
</html>
