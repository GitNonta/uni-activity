<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to LINE Login...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #374151;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #06C755;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.875rem;
            color: #6b7280;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>กำลังเชื่อมต่อการผูกบัญชี LINE</h1>
        <p>กรุณารอสักครู่ ระบบกำลังนำท่านกลับสู่เว็บไซต์...</p>
    </div>

    <script>
        fetch('active_url.json?t=' + Date.now())
            .then(response => {
                if (!response.ok) throw new Error('Failed to load active URL');
                return response.json();
            })
            .then(data => {
                if (!data.url) throw new Error('Invalid URL in JSON');
                const search = window.location.search;
                window.location.replace(data.url + '/line/callback' + search);
            })
            .catch(error => {
                console.error(error);
                document.querySelector('h1').innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
                document.querySelector('p').innerText = 'โปรดตรวจสอบลิงก์ หรือติดต่อผู้ดูแลระบบ';
                document.querySelector('.spinner').style.display = 'none';
            });
    </script>
</body>
</html>
