# Squid HTTP Proxy for iPad — Permissive browsing
# Port 3129 — allows all HTTP sites (HTTPS via CONNECT)

http_port 3129

# Safe ports
acl SSL_ports port 443
acl Safe_ports port 80 443 1025-65535
acl CONNECT method CONNECT

# Local network
acl local_clients src 127.0.0.0/8
acl local_clients src 192.168.0.0/16
acl local_clients src 10.0.0.0/8

# Still block dangerous ports
acl dangerous_ports port 7 9 19 22 23 25 110 111 135 139 445 512 513 514 515 1099 5900 5901 6000 6001 6665 6666 6667 6668 6669

# Access rules
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny CONNECT dangerous_ports
http_access allow local_clients
http_access deny all

# Memory cache (light)
cache_mem 32 MB
maximum_object_size_in_memory 512 KB
memory_replacement_policy heap GDSF

# Caching for speed
refresh_pattern -i \.(json|xml|csv)$ 0 20% 1440 override-lastmod override-expire
refresh_pattern -i \.(jpg|jpeg|png|gif|svg|webp|ico)$ 30 50% 4320
refresh_pattern -i \.(css|js)$ 15 50% 1440
refresh_pattern . 0 20% 4320

# Logging (lightweight)
access_log /data/data/com.termux/files/home/uni-activity/storage/logs/squid-ipad.log squid
cache_log /data/data/com.termux/files/home/uni-activity/storage/logs/squid-ipad-cache.log

# Timeouts
connect_timeout 10 seconds
read_timeout 60 seconds
request_timeout 30 seconds

# DNS
dns_nameservers 1.1.1.1 1.0.0.1

# Headers
forwarded_for on
via on
request_header_access X-Forwarded-For allow all
request_header_access Via allow all

# Bandwidth limit (500KB/s per client to protect Phone 1 WiFi)
delay_pools 1
delay_class 1 2
delay_parameters 1 4000000/4000000 500000/500000
delay_access 1 allow local_clients
delay_access 1 deny all
