<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Facial Depth — 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020510; font-family: 'Outfit', sans-serif;
      overflow: hidden; width: 100vw; height: 100vh;
    }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; }

    .glow-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at 50% 40%, rgba(0,200,255,0.06) 0%, transparent 70%);
    }

    .topbar {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 14px;
      color: rgba(255,255,255,0.85); font-size: 13px; letter-spacing: 1px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px); padding: 10px 22px; border-radius: 40px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #00e676; }
    .dot.off { background: #ff4d6a; }
    .stat { color: rgba(255,255,255,0.45); font-size: 12px; }

    .video-panel {
      position: fixed; z-index: 5; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.45);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .video-panel img { display: block; width: 240px; height: 180px; object-fit: cover; }
    .video-label {
      position: absolute; left: 10px; bottom: 8px; color: rgba(255,255,255,0.75);
      font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
      background: rgba(0,0,0,0.45); padding: 2px 8px; border-radius: 10px;
    }
    #panel-rgb { top: 20px; left: 20px; }
    #panel-depth { top: 20px; left: 276px; }

    .ui-panel {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 12px; align-items: center;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px); padding: 14px 24px; border-radius: 60px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .ui-label { color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
    .divider { width: 1px; height: 28px; background: rgba(255,255,255,0.15); margin: 0 4px; }
    .toggle-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); font-family: 'Outfit', sans-serif; font-size: 12px;
      letter-spacing: 0.5px; padding: 6px 16px; border-radius: 20px; cursor: pointer;
      transition: all 0.25s ease; display: flex; align-items: center; gap: 7px;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    .toggle-btn.active { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.5); color: #fff; }
    .toggle-btn svg { width: 14px; height: 14px; }
    .slider {
      -webkit-appearance: none; width: 110px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.2); outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #00e5ff; cursor: pointer; box-shadow: 0 0 8px rgba(0,229,255,0.7);
    }
    .color-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.25s ease;
    }
    .color-btn:hover, .color-btn.active { border-color: white; transform: scale(1.2); }
    .c-cyan { background: #00e5ff; } .c-purple { background: #b44fff; }
    .c-gold { background: #ffd54f; } .c-green { background: #00e676; }
    .c-pink { background: #ff4d8c; }
    .hint {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.35); font-size: 12px; z-index: 9; letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="glow-overlay"></div>

  <div class="topbar">
    <span class="dot" id="live-dot"></span>
    <span id="status">connecting…</span>
    <span class="stat" id="stat-ms">— ms</span>
    <span class="stat" id="stat-fps">— fps</span>
  </div>

  <div class="video-panel" id="panel-rgb"><img id="cam" alt="camera"><span class="video-label">Camera</span></div>
  <div class="video-panel" id="panel-depth"><img id="depth" alt="depth"><span class="video-label">Depth (turbo)</span></div>

  <div class="hint">ลากเพื่อหมุน • เลื่อนเพื่อซูม</div>

  <div class="ui-panel">
    <span class="ui-label">สี</span>
    <button class="color-btn c-cyan active" onclick="setColor(0x00e5ff, this)"></button>
    <button class="color-btn c-purple" onclick="setColor(0xb44fff, this)"></button>
    <button class="color-btn c-gold" onclick="setColor(0xffd54f, this)"></button>
    <button class="color-btn c-green" onclick="setColor(0x00e676, this)"></button>
    <button class="color-btn c-pink" onclick="setColor(0xff4d8c, this)"></button>
    <div class="divider"></div>
    <button id="btn-mesh" class="toggle-btn active" onclick="toggleMesh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L22 8.5 V15.5 L12 22 L2 15.5 V8.5 Z"/><path d="M12 2 V22 M2 8.5 L22 15.5 M22 8.5 L2 15.5"/></svg>
      ตาข่าย 3D
    </button>
    <button id="btn-rot" class="toggle-btn active" onclick="toggleAuto()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      หมุนอัตโนมัติ
    </button>
    <button id="btn-smooth" class="toggle-btn active" onclick="toggleSmooth()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12c4 0 5-6 9-6s5 6 9 6"/></svg>
      ปรับผิว
    </button>
    <div class="divider"></div>
    <span class="ui-label">นูน</span>
    <input class="slider" id="relief" type="range" min="0" max="200" value="100">
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/controls/OrbitControls.js"></script>
<script>
const GRID = 64;
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020510);
scene.fog = new THREE.FogExp2(0x020510, 0.045);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.2; controls.maxDistance = 8;
controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

scene.add(new THREE.AmbientLight(0x223344, 1.4));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(2, 3, 4); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x00e5ff, 1.2);
rimLight.position.set(-3, 1, -2); scene.add(rimLight);
const fillLight = new THREE.PointLight(0x6644ff, 1.2, 8);
fillLight.position.set(0, -2, 2); scene.add(fillLight);

// ---- depth-driven mesh: a GRID x GRID plane displaced by inverse depth ----
const geo = new THREE.PlaneGeometry(2, 2, GRID - 1, GRID - 1);
geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(GRID * GRID * 3), 3));
const mat = new THREE.MeshStandardMaterial({
  vertexColors: true, side: THREE.DoubleSide,
  roughness: 0.55, metalness: 0.1, flatShading: false,
});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

const wire = new THREE.Mesh(geo.clone(),
  new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.10 }));
wire.scale.setScalar(1.002); scene.add(wire);

const frame = new THREE.Mesh(
  new THREE.BoxGeometry(2.06, 2.06, 0.02),
  new THREE.MeshBasicMaterial({ color: 0x0a1622 }));
frame.position.z = -0.03; scene.add(frame);

// ---- state ----
let meshColor = new THREE.Color(0x00e5ff);
let relief = 1.0, smoothOn = true, haveDepth = false;
const raw = new Float32Array(GRID * GRID);      // latest grid (inverse depth)
const sm  = new Float32Array(GRID * GRID);      // smoothed
let lastSeq = -1, lastPoll = 0, fpsN = 0, fpsT = performance.now();

// 3x3 smoothing (edge-clamped)
function smooth() {
  for (let y = 0; y < GRID; y++)
    for (let x = 0; x < GRID; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= GRID || yy >= GRID) continue;
          s += raw[yy * GRID + xx]; n++;
        }
      sm[y * GRID + x] = s / n;
    }
}

function applyDepth() {
  const pos = geo.attributes.position;
  const col = geo.attributes.color;
  let dmin = Infinity, dmax = -Infinity;
  for (let i = 0; i < GRID * GRID; i++) {
    if (sm[i] < dmin) dmin = sm[i];
    if (sm[i] > dmax) dmax = sm[i];
  }
  const span = Math.max(dmax - dmin, 1e-6);
  for (let y = 0; y < GRID; y++)
    for (let x = 0; x < GRID; x++) {
      const i = y * GRID + x;
      const t = (sm[i] - dmin) / span;              // 0 = far, 1 = near
      pos.setZ(i, t * relief);                       // MiDaS: larger = closer
      // colormap: far = deep blue, near = accent color
      const c = meshColor.clone().lerp(new THREE.Color(0x0a2a5e), 1 - t);
      col.setXYZ(i, c.r, c.g, c.b);
    }
  pos.needsUpdate = true; col.needsUpdate = true;
  geo.computeVertexNormals();
}

function baseGeometry() {
  // neutral grid so depth can be re-applied without drift
  for (let y = 0; y < GRID; y++)
    for (let x = 0; x < GRID; x++) {
      const i = y * GRID + x;
      geo.attributes.position.setXYZ(i,
        -1 + (2 * x) / (GRID - 1), 1 - (2 * y) / (GRID - 1), 0);
    }
  geo.attributes.position.needsUpdate = true;
}
baseGeometry();

// ---- polling ----
async function poll() {
  const now = performance.now();
  if (now - lastPoll < 90) return;               // ~11 Hz JSON poll
  lastPoll = now;
  try {
    const r = await fetch('/depth.json', { cache: 'no-store' });
    const j = await r.json();
    if (!j.depth_b64) return;
    const bin = atob(j.depth_b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const f16 = new Uint16Array(bytes.buffer);
    const f32 = new Float32Array(GRID * GRID);
    // decode IEEE half -> float32
    for (let i = 0; i < f16.length; i++) {
      const h = f16[i];
      const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, m = h & 0x3ff;
      f32[i] = e === 0 ? s * m * Math.pow(2, -24)
             : e === 31 ? (m ? NaN : s * Infinity)
             : s * Math.pow(2, e - 15) * (1 + m / 1024);
    }
    raw.set(f32);
    if (smoothOn) smooth();
    else sm.set(raw);
    applyDepth();
    haveDepth = true;
    document.getElementById('status').textContent = 'LIVE';
    document.getElementById('live-dot').classList.remove('off');
    if (j.seq !== lastSeq) {
      lastSeq = j.seq;
      fpsN++;
      const dt = now - fpsT;
      if (dt > 1000) {
        document.getElementById('stat-fps').textContent =
          (fpsN / (dt / 1000)).toFixed(1) + ' fps';
        fpsN = 0; fpsT = now;
      }
      document.getElementById('stat-ms').textContent = j.depth_ms.toFixed(0) + ' ms';
    }
  } catch (e) {
    document.getElementById('status').textContent = 'offline';
    document.getElementById('live-dot').classList.add('off');
  }
}

// ---- video panels (MJPEG) ----
function feed(id, url) {
  const img = document.getElementById(id);
  let stopped = false;
  img.onerror = () => { if (!stopped) setTimeout(() => { img.src = url + '?t=' + Date.now(); }, 1500); };
  img.src = url;
}
feed('cam', '/video.mjpg');
feed('depth', '/depth.mjpg');

// ---- UI ----
function setColor(hex, btn) {
  meshColor.setHex(hex);
  wire.material.color.setHex(hex);
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (haveDepth) applyDepth();
}
function toggleAuto() {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('btn-rot').classList.toggle('active', controls.autoRotate);
}
function toggleMesh() {
  const on = !mesh.visible;
  mesh.visible = wire.visible = on;
  document.getElementById('btn-mesh').classList.toggle('active', on);
}
function toggleSmooth() {
  smoothOn = !smoothOn;
  document.getElementById('btn-smooth').classList.toggle('active', smoothOn);
  if (haveDepth) { smoothOn ? smooth() : sm.set(raw); applyDepth(); }
}
document.getElementById('relief').addEventListener('input', e => {
  relief = e.target.value / 100;
  if (haveDepth) applyDepth();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- render loop ----
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  poll();
  mesh.rotation.y = Math.sin(clock.getElapsedTime() * 0.4) * 0.25; // gentle sway
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
